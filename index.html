<style>
/* Layout: one phone-width column, bottom nav, sheets slide up. Cream ground, white tiles, tangerine + mint accents. */
:root{
  --bg:#FFF6E9; --surface:#FFFFFF; --ink:#2A1F1A; --muted:#7A6A60; --line:#F0DFC8; --sunk:#F3EADF;
  --accent:#FF7A45; --accent-deep:#D85A28; --mint:#2FBF9B; --mint-deep:#1F8F74; --sun:#FFC53D;
  --tint-orange:#FFE4D2; --tint-mint:#D7F5EC; --tint-pink:#FFE4EB; --pink-ink:#B3123C; --dark:#2A1F1A; --on-dark:#FFF6E9;
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1714; --surface:#2B221E; --ink:#FFF1E2; --muted:#B9A595; --line:#3A2E28; --sunk:#352A25;
  --tint-orange:#4A2C1E; --tint-mint:#1E3D35; --tint-pink:#4A2230; --pink-ink:#FFB3C6; --dark:#FFF6E9; --on-dark:#2A1F1A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E1714; --surface:#2B221E; --ink:#FFF1E2; --muted:#B9A595; --line:#3A2E28; --sunk:#352A25;
  --tint-orange:#4A2C1E; --tint-mint:#1E3D35; --tint-pink:#4A2230; --pink-ink:#FFB3C6; --dark:#FFF6E9; --on-dark:#2A1F1A; color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;font-weight:inherit;cursor:pointer;border:0;background:none;padding:0;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;width:100%}
textarea{min-height:110px;resize:vertical}
.ff{font-family:var(--display);font-weight:600}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) 120px}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.5px;line-height:1;text-wrap:balance}
.sub{font-size:12px;color:var(--muted);white-space:nowrap}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 10px;gap:10px}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 3px 0 var(--line);flex-shrink:0}
.round.accent{background:var(--accent);box-shadow:0 3px 0 var(--accent-deep);color:#2A1F1A}
.round.mint{background:var(--mint);box-shadow:0 3px 0 var(--mint-deep);color:#2A1F1A}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 12px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;background:var(--sunk);color:var(--ink);border:2px solid transparent;transition:transform .15s,background .2s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:block}
.chip .cnt{font-size:11px;font-weight:800;padding:1px 6px;border-radius:7px;background:var(--dark);color:var(--on-dark)}
.chip.on .cnt{background:var(--accent);color:#2A1F1A}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border-radius:22px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line);text-align:center;min-width:0;width:100%;outline:3px solid transparent;outline-offset:-3px;transition:transform .15s,outline-color .2s;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.tile:active{transform:scale(.94)}
.tile.sel{outline-color:var(--accent);background:var(--tint-orange)}
.tile .ic{width:58px;height:58px;display:block}
.tile .nm{font-family:var(--display);font-weight:600;font-size:13px;line-height:1.1;overflow-wrap:anywhere}
.tile .qt{font-size:11px;color:var(--muted)}
.tile .pill{position:absolute;top:8px;left:8px;font-family:var(--display);font-weight:600;font-size:10px;padding:2px 6px;border-radius:8px;color:#2A1F1A}
.tile .pill.low{background:var(--tint-pink);color:var(--pink-ink)}
.tile .chk{position:absolute;top:-6px;right:-6px;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
.tile.edit{outline:2px dashed var(--line);animation:jig .32s ease-in-out infinite alternate}
.tile.edit:nth-child(3n+2){animation-delay:.07s}.tile.edit:nth-child(3n){animation-delay:.14s}
.tile.fin{background:var(--sunk);box-shadow:none}
.tile.fin .ic{opacity:.45;filter:grayscale(.6)}
.step{display:flex;align-items:center;justify-content:space-between;width:100%}
.step button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.step .m{background:var(--tint-orange)}.step .p{background:var(--tint-mint)}
.step span{font-size:11px;font-weight:800}
.small{height:32px;padding:0 12px;border-radius:16px;font-family:var(--display);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:4px;color:#2A1F1A;background:var(--mint)}
.card{background:var(--surface);border-radius:22px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.card.dark{background:var(--dark);color:var(--on-dark);box-shadow:none}
.card.warm{background:var(--tint-orange);box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.mini{flex-shrink:0;display:flex;align-items:center;gap:6px;border-radius:18px;padding:5px 10px 5px 5px;background:var(--surface);box-shadow:0 2px 0 var(--line);font-family:var(--display);font-weight:600;font-size:13px}
.mini .ic{width:32px;height:32px;display:block}
.mini .tag{font-size:11px;padding:2px 7px;border-radius:8px;color:#2A1F1A}
.card.dark .mini{background:rgba(255,246,233,.1);box-shadow:none;color:var(--on-dark)}
.cta{width:100%;height:60px;border-radius:30px;font-family:var(--display);font-weight:600;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.cta:active{transform:scale(.96)}
.cta.prime{background:var(--accent);color:#2A1F1A;box-shadow:0 4px 0 var(--accent-deep)}
.cta.ink{background:var(--dark);color:var(--on-dark);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cta.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.cta:disabled{opacity:.5;transform:none}
.cta .num{min-width:28px;height:28px;border-radius:14px;background:var(--accent);color:#2A1F1A;display:grid;place-items:center;font-size:15px;padding:0 8px}
.stack{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
.stack>*{pointer-events:auto;max-width:448px;width:100%;margin:0 auto}
.stack.plain{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
nav.bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;height:66px;border-radius:33px;background:var(--surface);box-shadow:0 4px 0 var(--line),0 10px 30px rgba(42,31,26,.12);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:6}
nav.bar button{width:120px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:600;font-size:10px}
nav.bar button.on{background:var(--tint-orange)}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:22px;font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;animation:toast 2.6s cubic-bezier(.34,1.56,.64,1) both;max-width:90vw}
.sheetwrap{position:fixed;inset:0;background:rgba(30,23,20,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:rise .35s cubic-bezier(.2,.9,.3,1.1) both;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:600;font-size:24px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ic{width:120px;height:120px}
.empty p{margin:0;color:var(--muted);font-size:15px;max-width:28ch}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.spill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-family:var(--display);font-weight:600;font-size:14px;box-shadow:0 2px 0 var(--line)}
.spill.dim{background:var(--sunk);color:var(--muted);box-shadow:none}
.hero{position:relative;height:170px;border-radius:30px;display:grid;place-items:center;overflow:hidden}
.hero .ic{width:118px;height:118px;animation:float 2.6s ease-in-out infinite}
.steps{display:flex;flex-direction:column;gap:8px}
.stepc{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:0 2px 0 var(--line);font-size:15px}
.stepc .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;flex-shrink:0;color:#2A1F1A}
.rcard{display:flex;align-items:center;gap:12px;padding:12px}
.rcard .thumb{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex-shrink:0}
.rcard .thumb .ic{width:48px;height:48px}
.ring{position:relative;width:52px;height:52px;flex-shrink:0}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px}
.ring circle.v{transition:stroke-dashoffset .9s cubic-bezier(.34,1.3,.64,1)}
.people{display:flex;gap:2px}
.people svg{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.crav{height:96px;border-radius:24px;background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:0 3px 0 var(--line);outline:3px solid transparent;outline-offset:-3px;text-align:left;font-family:var(--display);font-weight:600;font-size:17px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.crav.on{outline-color:var(--dark)}
.crav .ic{width:52px;height:52px;flex-shrink:0}
.timec{flex:1;height:48px;border-radius:16px;font-family:var(--display);font-weight:600;font-size:16px;background:var(--surface);box-shadow:0 3px 0 var(--line)}
.timec.on{background:var(--dark);color:var(--on-dark);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.scanbox{height:300px;border-radius:28px;background:linear-gradient(160deg,#2E2420,#3C2E27);position:relative;overflow:hidden;display:grid;place-items:center;color:#FFF6E9;text-align:center;padding:20px}
.scanbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.scanline{position:absolute;left:36px;right:36px;height:3px;background:var(--mint);border-radius:2px;box-shadow:0 0 18px var(--mint);animation:scan 2s ease-in-out infinite}
.corners{position:absolute;inset:0;pointer-events:none}
.gen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:60vh;text-align:center}
.pot{position:relative;width:160px;height:160px}
.steam{position:absolute;width:14px;height:28px;border-radius:10px;background:var(--line);animation:steam 1.6s ease-in-out infinite}
.dots{display:flex;gap:8px}.dots span{width:10px;height:10px;border-radius:50%;animation:dot 1.2s ease-in-out infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.err{background:var(--tint-pink);color:var(--pink-ink);border-radius:16px;padding:10px 14px;font-size:13px}
.linkish{color:var(--accent-deep);text-decoration:underline}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes jig{from{transform:rotate(-1.6deg) translateY(-.5px)}to{transform:rotate(1.6deg) translateY(.5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%{box-shadow:0 3px 0 var(--accent-deep),0 0 0 0 rgba(255,122,69,.5)}100%{box-shadow:0 3px 0 var(--accent-deep),0 0 0 16px rgba(255,122,69,0)}}
.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}30%{opacity:.9}100%{transform:translateY(-22px) scaleX(1.4);opacity:0}}
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.rock{animation:rock 1.1s ease-in-out infinite}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
@keyframes scan{0%,100%{top:6%}50%{top:90%}}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}12%{transform:translate(-50%,0);opacity:1}80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
@keyframes spark{0%,100%{transform:scale(.6) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
.spark{animation:spark 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>

function matchIngredient(name) {
  const n = name.toLowerCase();
  return st.items.find(i => i.qty > 0 && (n.includes(i.name.toLowerCase()) || i.name.toLowerCase().includes(n) || i.id === slug(name)));
}
function usesFromSaved(rec) {
  const uses = {}; const scale = st.servings / (rec.servings || 2);
  rec.ingredients.forEach(g => { const it = matchIngredient(g.name); if (it) { const amt = it.unit === g.unit ? g.qty * scale : stepOf(it); uses[it.id] = Math.max(stepOf(it) / 2, Math.round(amt * 10) / 10); } });

}
function matchPct(rec) { if (!rec.ingredients || !rec.ingredients.length) return 0; const have = rec.ingredients.filter(g => matchIngredient(g.name)).length; return Math.round(have / rec.ingredients.length * 100); }

  if (st.rtab === 'insta') h += `<div class="card dark row" style="margin-bottom:10px"><div style="flex:1"><div class="ff" style="font-size:17px">Instagram saves</div><div class="sub" style="color:inherit;opacity:.7">Share a reel to your notes, paste the caption here. Direct import isn't possible from Instagram.</div></div><button class="small" style="background:var(--accent)" data-act="importsheet">Paste</button></div>`;
  if (!list.length) h += `<div class="empty">${icon('rice')}<p>${st.rtab === 'mine' ? 'Recipes you generate and save land here.' : st.rtab === 'insta' ? 'Nothing from Instagram yet.' : 'Paste a recipe, a link, or a caption and I\'ll file it.'}</p></div>`;
  h += `<div style="display:flex;flex-direction:column;gap:10px">${list.map((r, i) => { const pct = r.ingredients ? matchPct(r) : 100; const dash = Math.round(132 - 132 * pct / 100); const col = pct === 100 ? 'var(--mint)' : pct >= 60 ? 'var(--sun)' : '#FF6A8E'; return `<div class="card rcard" style="animation:rise .4s both;animation-delay:${i * 40}ms"><div class="thumb" style="background:${HERO_BG[r.hero] || '#FFF4DD'}">${icon(r.hero)}</div><div style="flex:1;min-width:0"><div class="ff" style="font-size:16px;line-height:1.1">${esc(r.name)}</div><div class="row" style="gap:6px;margin-top:6px;font-size:12px;color:var(--muted)">${SVG.clock}${r.time} min</div></div><div class="ring"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle class="v" cx="26" cy="26" r="21" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="${dash}" transform="rotate(-90 26 26)"/></svg><span>${pct}%</span></div><button class="round accent" style="width:44px;height:44px" data-act="openrecipe" data-id="${r.id}" aria-label="Open ${esc(r.name)}">${SVG.arrow}</button></div>`; }).join('')}</div>`;
  h += `<div style="display:flex;justify-content:center;margin-top:24px"><button class="spill" data-act="settings">${remoteOn() ? 'Synced' : 'Not synced'} · Settings</button></div>`;
  return h + nav('recipes');
}
function nav(on) { return `<nav class="bar" aria-label="Main"><button class="${on === 'fridge' ? 'on' : ''}" data-act="go" data-to="fridge">${SVG.fridge}Fridge</button><button class="${on === 'recipes' ? 'on' : ''}" data-act="go" data-to="recipes">${SVG.book}Recipes</button></nav>`; }

// ───────────────────────── sheets ─────────────────────────
function sheetHtml() {
  if (!st.sheet) return '';
  let body = '';
  if (st.sheet === 'scan') {
    const sc = st.scan;
    body = `<h2>Scan groceries</h2>`;
    if (!st.ai) {
      body += `<div class="card warm" style="display:flex;flex-direction:column;gap:8px"><div class="ff" style="font-size:17px">AI is off</div><p class="note" style="margin:0;color:inherit">${CFG.workerUrl ? 'Enter your passcode in Settings to turn on scanning and recipes.' : 'Scanning and recipes need the Fridge Worker set up (see the README).'} You can still log everything by hand.</p></div>${CFG.workerUrl ? `<button class="cta prime" data-act="settings">Open Settings</button>` : ''}<button class="cta ghost" data-act="add">${SVG.plus}Add by hand instead</button>`;
    } else if (!sc.detected && (!st.canImage || sc.typing)) {
      body += `<p class="note" style="margin:0">${st.canImage ? 'Type what you bought.' : 'Type or dictate what you bought.'} Amounts are optional; I\'ll fill sensible ones.</p><div class="field">Groceries<textarea id="scan-text" placeholder="6 eggs, 2 salmon fillets, bag of spinach, cherry tomatoes, soy sauce…">${esc(sc.text || '')}</textarea></div>${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}<button class="cta prime" data-act="runtext" ${st.busy === 'scan' ? 'disabled' : ''}>${st.busy === 'scan' ? 'Reading…' : 'Make the list'}</button>${st.canImage ? `<button class="cta ghost" data-act="rescan">${SVG.cam}Use a photo instead</button>` : ''}`;
    } else if (!sc.detected) {
      body += `<div class="scanbox">${sc.preview ? `<img src="${sc.preview}" alt="">` : ''}<svg class="corners" viewBox="0 0 346 300" fill="none" stroke="#FF7A45" stroke-width="4" stroke-linecap="round" preserveAspectRatio="none" aria-hidden="true"><path d="M28 60V40a12 12 0 0 1 12-12h20M286 28h20a12 12 0 0 1 12 12v20M318 240v20a12 12 0 0 1-12 12h-20M60 272H40a12 12 0 0 1-12-12v-20"/></svg>${st.busy === 'scan' ? '<div class="scanline"></div>' : ''}${!sc.preview ? `<div style="position:relative"><div class="ff" style="font-size:18px">Take a photo of what you bought</div><div class="sub" style="color:inherit;opacity:.7">Lay it out on the counter. Up to ${st.imgMax || 1} photo${(st.imgMax || 1) > 1 ? 's' : ''}.</div></div>` : (st.busy === 'scan' ? `<div class="ff" style="position:relative;font-size:18px;text-shadow:0 2px 8px #000">Looking…</div>` : '')}</div>`;
      body += `<label class="cta ghost" style="position:relative;overflow:hidden" for="photo">${SVG.cam}${sc.preview ? 'Choose different photo' : 'Take or choose photo'}</label><input id="photo" type="file" accept="${st.imgAccept || 'image/*'}" ${(st.imgMax || 1) > 1 ? 'multiple' : ''} capture="environment" class="sr">`;
      if (st.err) body += `<div class="err">${esc(st.err)}</div>`;
      body += `<button class="cta prime" data-act="runscan" ${sc.files.length && st.busy !== 'scan' ? '' : 'disabled'}>${st.busy === 'scan' ? 'Looking…' : 'Find ingredients'}</button><button class="cta ghost" data-act="typelist">Type a list instead</button>`;
    } else {
      body += `<p class="note">Check the amounts — camera guesses are rough. Untick anything wrong.</p><div style="display:flex;flex-direction:column;gap:8px">${sc.detected.map((d, i) => `<div class="card row" style="padding:8px 10px;${d.keep ? '' : 'opacity:.5'}"><input type="checkbox" id="k${i}" data-scan="keep" data-i="${i}" ${d.keep ? 'checked' : ''} style="width:22px;height:22px;flex-shrink:0;padding:0"><label for="k${i}" style="width:40px;height:40px;flex-shrink:0">${icon(d.icon || CAT_ICON[d.cat])}</label><div style="flex:1;min-width:0"><input type="text" value="${esc(d.name)}" data-scan="name" data-i="${i}" aria-label="Name" style="padding:6px 10px;border-radius:10px;font-size:14px;margin-bottom:4px"><div class="row" style="gap:6px"><input type="number" value="${d.qty}" min="0" step="any" data-scan="qty" data-i="${i}" aria-label="Amount" style="padding:6px 10px;border-radius:10px;font-size:14px;width:80px"><select data-scan="unit" data-i="${i}" aria-label="Unit" style="padding:6px 8px;border-radius:10px;font-size:14px;flex:1">${UNITS.map(u => `<option ${u === d.unit ? 'selected' : ''}>${u}</option>`).join('')}</select><select data-scan="cat" data-i="${i}" aria-label="Category" style="padding:6px 8px;border-radius:10px;font-size:14px;flex:1">${Object.keys(CATS).map(c => `<option value="${c}" ${c === d.cat ? 'selected' : ''}>${CATS[c].label}</option>`).join('')}</select></div></div></div>`).join('')}</div>`;
      body += `<button class="cta prime" data-act="addscan">${SVG.plus}Add ${sc.detected.filter(d => d.keep).length} to Fridge</button><button class="cta ghost" data-act="rescan">${st.canImage ? 'Scan another photo' : 'Start over'}</button>`;
    }
  } else if (st.sheet === 'add') {
    const a = st.add || { name: '', qty: 1, unit: 'pcs', cat: 'fibre', shelf: 7, exp: '' };
    body = `<h2>Add ingredient</h2><div class="field">Name<div class="row"><input type="text" id="a-name" value="${esc(a.name)}" placeholder="e.g. Bok choy" autocomplete="off">${st.ai ? `<button class="round mint" data-act="autofill" aria-label="Fill in details with Claude" style="width:44px;height:44px" ${st.busy === 'fill' ? 'disabled' : ''}>${st.busy === 'fill' ? '…' : '✦'}</button>` : ''}</div></div>
    <div class="two"><div class="field">Amount<input type="number" id="a-qty" value="${a.qty}" min="0" step="any"></div><div class="field">Unit<select id="a-unit">${UNITS.map(u => `<option ${u === a.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></div></div>
    <div class="two"><div class="field">Type<select id="a-cat">${Object.keys(CATS).map(c => `<option value="${c}" ${c === a.cat ? 'selected' : ''}>${CATS[c].label}</option>`).join('')}</select></div><div class="field">Keeps for (days)<input type="number" id="a-shelf" value="${a.shelf}" min="1"></div></div>
    <div class="field">Expiry date (optional, overrides)<input type="date" id="a-exp" value="${esc(a.exp)}"></div>
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <button class="cta prime" data-act="addsave">${SVG.plus}Add to Fridge</button>`;
  } else if (st.sheet === 'settings') {
    const on = remoteOn();
    body = `<h2>Settings</h2><p class="note">The passcode turns on sync between phones and AI scanning and recipes. It is stored on this phone only. Anyone with it can read your fridge list and use your AI budget, so share it only with your household.</p>
    <div class="field">Passcode<input type="password" id="set-pass" autocomplete="current-password" value="${esc(passcode())}" placeholder="From your Worker setup"></div>
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}${on && st.syncState === 'ok' ? '<p class="note" style="color:var(--mint-deep)">Connected. Sync and AI are on.</p>' : ''}
    <button class="cta prime" data-act="savepass" ${st.busy === 'pass' ? 'disabled' : ''}>${st.busy === 'pass' ? 'Checking…' : 'Save and connect'}</button>
    ${on ? '<button class="cta ghost" data-act="forgetpass">Sign out on this phone</button>' : ''}
    ${CFG.workerUrl ? '' : '<p class="note">No Worker URL in config.js yet. The app works offline on this phone only.</p>'}`;
  } else if (st.sheet === 'import') {
    body = `<h2>Add a recipe</h2><p class="note">Paste a recipe, a link, or an Instagram caption. Claude pulls out the ingredients and steps and matches them to your fridge.</p><div class="field">Text or link<textarea id="imp-text" placeholder="Paste here…"></textarea></div>${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}<button class="cta prime" data-act="runimport" ${st.busy === 'import' ? 'disabled' : ''}>${st.busy === 'import' ? 'Reading…' : 'Save recipe'}</button>${st.ai ? '' : '<p class="note">Turn on AI in Settings to use this.</p>'}`;
  }
  return `<div class="sheetwrap" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" data-stop="1"><div class="grab"></div>${body}</div></div>`;
}

// ───────────────────────── render ─────────────────────────
const app = document.getElementById('app'), overlay = document.getElementById('overlay');
function render() {
  const v = { fridge: viewFridge, craving: viewCraving, gen: viewGen, recipe: viewRecipe, recipes: viewRecipes }[st.screen] || viewFridge;
  app.innerHTML = v();
  overlay.innerHTML = sheetHtml() + (st.toast ? `<div class="toast" role="status"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2FBF9B"/><path d="M7 12.5l3.5 3.5L17 9" stroke="#1E1714" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(st.toast)}</div>` : '');
}

// ───────────────────────── events ─────────────────────────
let lp = null, held = false;
function setQty(id, q) { const it = item(id); if (!it) return; it.qty = Math.max(0, Math.round(q * 10) / 10); if (it.qty === 0) delete st.selected[id]; persist('items'); }
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-act="pick"].tile'); if (!t) return;
  clearTimeout(lp); held = false;
  lp = setTimeout(() => { held = true; st.mode = 'edit'; render(); }, 450);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lp)));
document.addEventListener('pointermove', e => { if (lp && e.buttons === 0) clearTimeout(lp); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.tile')) e.preventDefault(); });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closesheet' && e.target !== el) return; // click inside sheet
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'filter': st.filter = id; break;
    case 'pick': if (held) { held = false; return; } st.selected[id] = !st.selected[id]; break;
    case 'inc': { const it = item(id); if (it.qty === 0) it.addedAt = Date.now(); setQty(id, it.qty + stepOf(it)); it.max = Math.max(it.max || 0, it.qty); break; }
    case 'dec': { const it = item(id); setQty(id, it.qty - stepOf(it)); break; }
    case 'restock': { const it = item(id); it.qty = it.max || stepOf(it); it.addedAt = Date.now(); it.exp = null; persist('items'); toast(it.name + ' restocked'); break; }
    case 'remove': st.items = st.items.filter(i => i.id !== id); delete st.selected[id]; persist('items'); break;
    case 'done': st.mode = 'select'; break;
    case 'picksoon': soonList().forEach(i => { st.selected[i.id] = true; }); st.filter = 'all'; break;
    case 'go': st.screen = el.dataset.to; st.err = null; break;
    case 'craving': st.screen = 'craving'; st.err = null; break;
    case 'flav': st.flavour = st.flavour === id ? null : id; break;
    case 'people': st.servings = Math.min(6, Math.max(1, st.servings + Number(el.dataset.d))); persist('prefs'); break;
    case 'time': st.time = Number(el.dataset.t); break;
    case 'cook': st.shown = []; generate([]); return;
    case 'shuffle': generate(st.shown); return;
    case 'swap': { const r = st.recipe; const from = item(el.dataset.from), to = item(el.dataset.to); const amt = Math.max(stepOf(to), Math.round((r.uses[from.id] / (from.max || r.uses[from.id])) * (to.max || to.qty) / stepOf(to)) * stepOf(to)); delete r.uses[from.id]; r.uses[to.id] = Math.min(to.qty, amt); toast(from.name + ' → ' + to.name); break; }
    case 'saverecipe': { const r = st.recipe; const i = st.recipes.findIndex(x => x.id === r.id); if (i >= 0) { st.recipes.splice(i, 1); toast('Removed'); } else { st.recipes.unshift(Object.assign({}, r, { src: 'mine', ingredients: Object.keys(r.uses).map(k => ({ name: item(k).name, qty: r.uses[k], unit: item(k).unit, cat: item(k).cat })) })); toast('Saved to Recipes'); } persist('recipes'); break; }
    case 'accept': { const r = st.recipe; Object.keys(r.uses).forEach(k => { const it = item(k); if (it) setQty(k, it.qty - r.uses[k]); }); st.selected = {}; st.flavour = null; st.screen = 'fridge'; st.filter = 'all'; persist('items'); toast('Fridge updated'); break; }
    case 'rtab': st.rtab = id; break;
    case 'openrecipe': { const r = st.recipes.find(x => x.id === id); if (!r) break; st.recipe = Object.assign({}, r, { uses: usesFromSaved(r), servings: st.servings }); st.screen = 'recipe'; break; }
    case 'scan': st.sheet = 'scan'; st.scan = { files: [], preview: null, detected: null }; st.err = null; break;
    case 'runscan': scanPhotos(); return;
    case 'runtext': { const t = document.getElementById('scan-text'); st.scan.text = t ? t.value : ''; scanText(st.scan.text); return; }
    case 'typelist': st.scan.typing = true; st.err = null; break;
    case 'rescan': st.scan = { files: [], preview: null, detected: null, typing: false }; st.err = null; break;
    case 'addscan': { addIncoming(st.scan.detected.filter(d => d.keep && d.name && d.qty > 0)); toast(st.scan.detected.filter(d => d.keep).length + ' added to Fridge'); st.sheet = null; st.filter = 'all'; break; }
    case 'add': st.sheet = 'add'; st.add = { name: '', qty: 1, unit: 'pcs', cat: 'fibre', shelf: 7, exp: '' }; st.err = null; break;
    case 'autofill': { readAddForm(); st.busy = 'fill'; render(); const n = await autofill(st.add.name); st.busy = null; if (n) { st.add = Object.assign(st.add, { name: n.name, unit: n.unit, cat: n.cat, shelf: n.shelf, icon: n.icon }); } else st.err = 'Could not fill that in.'; break; }
    case 'addsave': { readAddForm(); const a = st.add; if (!a.name.trim()) { st.err = 'Give it a name.'; break; } const gs = guessFor(a.name); if (gs && !a.icon) { a.icon = gs.icon; if (!a.touchedCat) a.cat = gs.cat; if (!a.touchedShelf) a.shelf = gs.shelf; } let shelf = Number(a.shelf) || 7; let exp = null; if (a.exp) { const d = (new Date(a.exp) - Date.now()) / DAY; exp = Math.max(0, Math.round(d)); } addIncoming([{ name: a.name.trim(), qty: Number(a.qty) || 1, unit: a.unit, cat: a.cat, shelf, icon: a.icon || null }]); if (exp != null) { const it = item(slug(a.name.trim())); if (it) it.exp = exp; persist('items'); } st.sheet = null; st.filter = 'all'; toast(a.name.trim() + ' added'); break; }
    case 'importsheet': st.sheet = 'import'; st.err = null; break;
    case 'runimport': { const t = document.getElementById('imp-text'); importRecipe(t ? t.value : ''); return; }
    case 'closesheet': st.sheet = null; st.err = null; break;
    case 'settings': st.sheet = 'settings'; st.err = null; break;
    case 'savepass': {
      const v = (document.getElementById('set-pass') || {}).value || '';
      if (!CFG.workerUrl) { st.err = 'Add the Worker URL to config.js first.'; break; }
      st.busy = 'pass'; st.err = null; render();
      const prev = passcode(); lsSet(KEY, v.trim());
      try { const r = await api('/data'); if (r.status === 401) { lsSet(KEY, prev || null); st.err = 'That passcode was rejected.'; } else if (!r.ok) { st.err = 'Worker answered ' + r.status + '.'; } else { st.syncState = 'ok'; connectAi(); await pull(); st.sheet = null; toast('Connected'); } }
      catch (e) { lsSet(KEY, prev || null); st.err = 'Could not reach the Worker.'; }
      st.busy = null; break;
    }
    case 'forgetpass': lsSet(KEY, null); st.ai = null; st.syncState = null; st.sheet = null; toast('Signed out on this phone'); break;
    default: return;
  }
  render();
});
function readAddForm() {
  const g = i => document.getElementById(i);
  if (!g('a-name')) return;
  const prev = st.add || {}; st.add = Object.assign(prev, { touchedCat: prev.touchedCat || g('a-cat').value !== (prev.cat || 'fibre'), touchedShelf: prev.touchedShelf || String(g('a-shelf').value) !== String(prev.shelf || 7), name: g('a-name').value, qty: g('a-qty').value, unit: g('a-unit').value, cat: g('a-cat').value, shelf: g('a-shelf').value, exp: g('a-exp').value });
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'photo') {
    const files = Array.from(t.files || []).slice(0, st.imgMax || 1);
    st.scan.files = files; st.err = null;
    if (files[0]) { const fr = new FileReader(); fr.onload = () => { st.scan.preview = fr.result; render(); }; fr.readAsDataURL(files[0]); }
    render();
  } else if (t.dataset.scan) {
    const d = st.scan.detected[Number(t.dataset.i)]; if (!d) return;
    const k = t.dataset.scan;
    if (k === 'keep') d.keep = t.checked; else if (k === 'qty') d.qty = Number(t.value) || 0; else d[k] = t.value;
    if (k === 'keep') render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && st.sheet) { st.sheet = null; render(); } });

// ───────────────────────── boot ─────────────────────────
loadLocal(); render(); connectAi(); connectDb();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
